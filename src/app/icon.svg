<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="28" fill="#0d0e15" />
  <!-- Rounded gradient outer accent border -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <g filter="url(#glow)" transform="translate(18, 18)">
    <!-- Sleek rotated price tag -->
    <path d="M 12 8 A 4 4 0 0 0 8 12 L 8 36 A 4 4 0 0 0 12 40 L 36 40 L 56 20 L 36 0 Z" fill="url(#tagGradient)" transform="rotate(45, 32, 20)" />
    <!-- Tag string eyelet -->
    <circle cx="21" cy="21" r="3" fill="#0d0e15" />
  </g>
</svg>
